<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1590" viewBox="0 0 720 795" role="img" aria-label="Reference architecture: a browser reaches only the frontend container. Inside the backend, controllers and the service layer sit above a band of engines that are plain Python, and below that a band of adapters — the DAOs, the clients and the model providers — which is the only code that reaches the database container, an optional model container, or a hosted model API" font-family="Source Sans 3, Helvetica, Arial, sans-serif"><rect class="gp" x="190" y="5" width="240" height="115" rx="12" fill="#f0e6d2" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="204" y="27" font-size="13" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">frontend container</text><rect class="gp" x="10" y="130" width="700" height="480" rx="12" fill="#f0e6d2" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="24" y="152" font-size="13" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">backend container · backend/</text><rect class="gp" x="90" y="335" width="610" height="120" rx="12" fill="#fffaf0" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="104" y="357" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">engines: plain Python — no web, no SQL</text><rect class="gp" x="70" y="470" width="630" height="120" rx="12" fill="#fffaf0" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="84" y="492" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">adapters: the only code that reaches outside the backend</text><rect class="gp" x="80" y="635" width="190" height="120" rx="12" fill="#f0e6d2" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="94" y="745" font-size="13" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="ro