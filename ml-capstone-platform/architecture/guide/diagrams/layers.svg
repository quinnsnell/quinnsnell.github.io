<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 720 310" role="img" aria-label="Backend layers: a request goes to a controller, then a service, then the DAO, then Postgres; services use plain-Python engines and raise errors that main.py turns into HTTP codes" font-family="Source Sans 3, Helvetica, Arial, sans-serif"><rect class="gp" x="315" y="170" width="400" height="130" rx="12" fill="#f0e6d2" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="329" y="192" font-size="13" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">engines: plain Python, no web, no SQL</text><g class="ed"><path d="M110 58L141 58" fill="none" stroke="#2a1a10" stroke-width="1.5"/><path d="M150 58L140.0 63.0L140.0 53.0z" fill="#2a1a10"/></g><g class="ed"><path d="M275 58L306 58" fill="none" stroke="#2a1a10" stroke-width="1.5"/><path d="M315 58L305.0 63.0L305.0 53.0z" fill="#2a1a10"/></g><g class="ed"><path d="M440 58L471 58" fill="none" stroke="#2a1a10" stroke-width="1.5"/><path d="M480 58L470.0 63.0L470.0 53.0z" fill="#2a1a10"/></g><g class="ed"><path d="M595 58L621 58" fill="none" stroke="#2a1a10" stroke-width="1.5"/><path d="M630 58L620.0 63.0L620.0 53.0z" fill="#2a1a10"/></g><g class="ed"><path d="M335 86L250.577 192.936" fill="none" stroke="#2a1a10" stroke-width="1.5"/><path d="M245 200L247.3 189.1L255.1 195.2z" fill="#2a1a10"/></g><text class="el" x="272" y="150" text-anchor="end" font-size="13" font-weight="500" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">raises NotFound</text><g class="ed"><path d="M390 86L390 206" fill="none" stroke="#2a1a10" stroke-width="1.5"/><path d="M390 215L385.0 205.0L395.0 205.0z" fill="#2a1a10"/></g><text class="el" x="402" y="128" text-anchor="start" font-size="13" font-weight="500" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">uses</text><rect class="bx" x="10" y="30" width="100" he