<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="770" viewBox="0 0 720 385" role="img" aria-label="How main.py wires the backend: once at startup, create_app calls build_container, keeps the Container on app.state, and registers each controller module's routes; on each request, a controller gets the Container through deps.container and calls one service method" font-family="Source Sans 3, Helvetica, Arial, sans-serif"><rect class="gp" x="10" y="95" width="700" height="130" rx="12" fill="#f0e6d2" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="24" y="215" font-size="13" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Once, when the backend starts</text><rect class="gp" x="10" y="245" width="700" height="130" rx="12" fill="#f0e6d2" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="24" y="267" font-size="13" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Then, on every request</text><g class="ed"><path d="M300 71L133.528 127.125" fill="none" stroke="#2a1a10" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M125 130L132.9 122.1L136.1 131.5z" fill="#2a1a10"/></g><text class="el" x="196" y="92" text-anchor="middle" font-size="13" font-weight="500" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">① calls</text><g class="ed"><path d="M230 158L246 158" fill="none" stroke="#2a1a10" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M255 158L245.0 163.0L245.0 153.0z" fill="#2a1a10"/></g><text class="el" x="242" y="120" text-anchor="middle" font-size="13" font-weight="500" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">② keeps it</text><g class="ed"><path d="M420 71L586.472 127.125" fill="none" stroke="#2a1a10" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M595 130L583.9 131.5L587.1 122.1z" fill="#2a1a10"/></g><text class="el" x="526" y="92" text-anchor="middle" font-size="13" font-weight="500" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">③ registers</text><g class="ed"><path d="M360 186L360 271" fill="none" stroke="#2a1a10" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M360 280L355.0 270.0L365.0 270.0z" fill="#2a1a10"/></g><text class="el" x="372" y="236" text-anchor="start" font-size="13" font-weight="500" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">reads</text><g class="ed"><path d="M220 308L256 308" fill="none" stroke="#2a1a10" stroke-width="1.5"/><path d="M265 308L255.0 313.0L255.0 303.0z" fill="#2a1a10"/></g><g class="ed"><path d="M455 308L491 308" fill="none" stroke="#2a1a10" stroke-width="1.5"/><path d="M500 308L490.0 313.0L490.0 303.0z" fill="#2a1a10"/></g><rect class="bx" x="230" y="15" width="260" height="56" rx="8" fill="#f9dfcc" stroke="#b5370f" stroke-width="1.5"/><text class="bt" x="360.0" y="40.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#f9dfcc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">main.py: create_app()</text><text x="360.0" y="58.0" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#f9dfcc" stroke-width="4" paint-order="stroke" stroke-linejoin="round">runs once; also maps errors to HTTP</text><rect class="bx" x="20" y="130" width="210" height="56" rx="8" fill="#fffaf0" stroke="#2a1a10" stroke-width="1.5"/><text class="bt" x="125.0" y="155.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">container.py</text><text x="125.0" y="173.0" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">build_container(settings)</text><rect class="bx" x="255" y="130" width="210" height="56" rx="8" fill="#fffaf0" stroke="#2a1a10" stroke-width="1.5"/><text class="bt" x="360.0" y="155.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">app.state.container</text><text x="360.0" y="173.0" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">the one Container</text><rect class="bx" x="490" y="130" width="210" height="56" rx="8" fill="#fffaf0" stroke="#2a1a10" stroke-width="1.5"/><text class="bt" x="595.0" y="155.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">controllers/*.py</text><text x="595.0" y="173.0" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">include_router(router)</text><rect class="bx" x="30" y="280" width="190" height="56" rx="8" fill="#fffaf0" stroke="#2a1a10" stroke-width="1.5"/><text class="bt" x="125.0" y="305.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">a controller</text><text x="125.0" y="323.0" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">POST /api/feedback</text><rect class="bx" x="265" y="280" width="190" height="56" rx="8" fill="#fffaf0" stroke="#2a1a10" stroke-width="1.5"/><text class="bt" x="360.0" y="305.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">deps.container()</text><text x="360.0" y="323.0" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Depends(container)</text><rect class="bx" x="500" y="280" width="190" height="56" rx="8" fill="#fffaf0" stroke="#2a1a10" stroke-width="1.5"/><text class="bt" x="595.0" y="305.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">c.feedback.send()</text><text x="595.0" y="323.0" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">one service method</text><rect x="102" y="181" width="136" height="22" rx="11" fill="#fffaf0" stroke="#b5370f" stroke-width="1.25"/><text x="170" y="196.5" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#b5370f">Composition root</text><rect x="297" y="331" width="166" height="22" rx="11" fill="#fffaf0" stroke="#b5370f" stroke-width="1.25"/><text x="380" y="346.5" text-anchor="middle" font-size="13" font-weight="600" font-style="italic" fill="#b5370f">Dependency injection</text></svg>
