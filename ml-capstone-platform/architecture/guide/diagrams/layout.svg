<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 720 590" role="img" aria-label="Directory layout: the repo root holds the rules file, compose files, CI and docs, then one folder per container; inside backend/app, one folder per layer" font-family="Source Sans 3, Helvetica, Arial, sans-serif"><rect class="gp" x="10" y="10" width="385" height="490" rx="12" fill="#f0e6d2" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="24" y="32" font-size="13" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">the repo</text><rect class="gp" x="405" y="10" width="305" height="490" rx="12" fill="#f0e6d2" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="419" y="32" font-size="13" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">backend/: one folder per layer</text><text x="26" y="62" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">your-project/</text><text x="42" y="83" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">CLAUDE.md</text><text x="264" y="83" font-size="13" fill="#6b5744">rules for people</text><text x="42" y="104" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">AGENTS.md</text><text x="264" y="104" font-size="13" fill="#6b5744">and for agents</text><text x="42" y="125" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">README.md</text><text x="42" y="146" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">docker-compose.yaml</text><text x="264" y="146" font-size="13" fill="#6b5744">every container</text><text x="42" y="167" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">docker-compose.override.yml</text><text x="264" y="167" font-size="13" fill="#6b5744">local changes</text><text x="42" y="188" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">.env.example</text><text x="264" y="188" font-size="13" fill="#6b5744">every setting</text><text x="42" y="209" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">smoke-test.sh</text><text x="264" y="209" font-size="13" fill="#6b5744">end-to-end check</text><text x="42" y="230" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">.github/workflows/</text><text x="264" y="230" font-size="13" fill="#6b5744">tests before deploy</text><text x="42" y="251" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">docs/</text><text x="58" y="272" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">architecture.md</text><text x="264" y="272" font-size="13" fill="#6b5744">your map</text><text x="58" y="293" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">reference-architecture.md</text><text x="264" y="293" font-size="13" fill="#6b5744">agent rules</text><text x="58" y="314" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">STATUS.md</text><text x="264" y="314" font-size="13" fill="#6b5744">what works</text><text x="42" y="335" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">frontend/</text><text x="264" y="335" font-size="13" fill="#6b5744">frontend container</text><text x="58" y="356" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">src/api/client.ts</text><text x="264" y="356" font-size="13" fill="#6b5744">the one API client</text><text x="58" y="377" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">src/pages/</text><text x="264" y="377" font-size="13" fill="#6b5744">one per screen</text><text x="58" y="398" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">src/components/</text><text x="264" y="398" font-size="13" fill="#6b5744">shared parts</text><text x="42" y="419" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">model-service/</text><text x="264" y="419" font-size="13" fill="#6b5744">optional, GPU</text><text x="58" y="440" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">engines/</text><text x="264" y="440" font-size="13" fill="#6b5744">real.py, fake.py</text><text x="42" y="461" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">backend/</text><text x="264" y="461" font-size="13" fill="#6b5744">see the right side</text><text x="42" y="482" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">terraform/</text><text x="264" y="482" font-size="13" fill="#6b5744">deploy wiring</text><text x="421" y="62" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">backend/</text><text x="437" y="83" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">main.py</text><text x="592" y="83" font-size="13" fill="#6b5744">startup only</text><text x="437" y="104" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">app/</text><text x="453" y="125" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">config.py</text><text x="592" y="125" font-size="13" fill="#6b5744">env vars, once</text><text x="453" y="146" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">container.py</text><text x="592" y="146" font-size="13" fill="#6b5744">builds every part</text><text x="453" y="167" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">db.py</text><text x="592" y="167" font-size="13" fill="#6b5744">connection pool</text><text x="453" y="188" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">controllers/</text><text x="592" y="188" font-size="13" fill="#6b5744">routes, thin</text><text x="469" y="209" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">deps.py</text><text x="592" y="209" font-size="13" fill="#6b5744">container, user</text><text x="453" y="230" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">services/</text><text x="592" y="230" font-size="13" fill="#6b5744">the rules</text><text x="469" y="251" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">errors.py</text><text x="592" y="251" font-size="13" fill="#6b5744">NotFound, …</text><text x="453" y="272" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">dao/</text><text x="592" y="272" font-size="13" fill="#6b5744">the only SQL</text><text x="453" y="293" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">engines/</text><text x="592" y="293" font-size="13" fill="#6b5744">core logic</text><text x="453" y="314" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">ml/</text><text x="592" y="314" font-size="13" fill="#6b5744">model interface</text><text x="469" y="335" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">providers/</text><text x="592" y="335" font-size="13" fill="#6b5744">real + fake</text><text x="453" y="356" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">clients/</text><text x="592" y="356" font-size="13" fill="#6b5744">other containers</text><text x="453" y="377" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">models/</text><text x="592" y="377" font-size="13" fill="#6b5744">API shapes</text><text x="437" y="398" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">config/models.yaml</text><text x="592" y="398" font-size="13" fill="#6b5744">model per role</text><text x="437" y="419" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">migrations/</text><text x="592" y="419" font-size="13" fill="#6b5744">001_….sql</text><text x="437" y="440" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2a1a10">tests/</text><text x="592" y="440" font-size="13" fill="#6b5744">api, engine, flow</text><text x="437" y="461" font-family="Source Code Pro, Menlo, Consolas, monospace" font-size="13" fill="#2a1a10">Dockerfile</text><text x="360" y="528" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">One folder per container. Inside the backend, one folder per layer.</text><text x="360" y="550" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">A file goes in the folder of the layer it belongs to, never in two.</text><text x="360" y="572" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Change one thing, edit one folder: that is what keeps it easy to maintain.</text></svg>
