<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 720 330" role="img" aria-label="Event log: an encounter is a list of numbered events; the student view, the patient prompt, the checklist score and faculty review all read the same list" font-family="Source Sans 3, Helvetica, Arial, sans-serif"><rect class="gp" x="10" y="22" width="700" height="120" rx="12" fill="#f0e6d2" stroke="#6b5744" stroke-width="1.25"/><text class="gl" x="24" y="44" font-size="13" fill="#6b5744" stroke="#f0e6d2" stroke-width="4" paint-order="stroke" stroke-linejoin="round">encounter_events: one row per thing that happened, never edited</text><rect class="bx" x="22" y="62" width="126" height="56" rx="8" fill="#fffaf0" stroke="#2a1a10" stroke-width="1.5"/><text class="bt" x="85.0" y="87.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">1 · student</text><text x="85.0" y="105.0" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">“Any chest pain?”</text><rect class="bx" x="158" y="62" width="126" height="56" rx="8" fill="#fffaf0" stroke="#2a1a10" stroke-width="1.5"/><text class="bt" x="221.0" y="87.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">2 · patient</text><text x="221.0" y="105.0" text-anchor="middle" font-size="13" fill="#6b5744" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">revealed: HPI1</text><rect class="bx" x="294" y="62" width="126" height="56" rx="8" fill="#fffaf0" stroke="#2a1a10" stroke-width="1.5"/><text class="bt" x="357.0" y="87.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2a1a10" stroke="#fffaf0" stroke-width="4" paint-order="stroke" stroke-linejoin="round">3 · action</text><text x="357.0" y="105.0" text-anchor="middle